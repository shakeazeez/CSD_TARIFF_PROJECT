name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to deploy (leave empty for auto-versioning)'
        required: false
        default: ''

env:
  AWS_REGION: ap-southeast-1 
  ECR_REPOSITORY_TARIFFCALC: goattariff/tariffcalc
  ECR_REPOSITORY_USER: goattariff/user
  ECR_REPOSITORY_NEWS: goattariff/news
  ECR_REPOSITORY_ROUTER: goattariff/router
  ECR_REPOSITORY_FRONTEND: goattariff/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Test Backend Services
      run: |
        cd backend/tariffCalc
        mvn test
        cd ../user
        mvn test
        cd ../news
        mvn test

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Test Frontend
      run: |
        cd frontend/tarrif-project
        npm install
        npm run lint

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set version tag
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version_tag }}" ]; then
          echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
        fi

    - name: Build and push tariffCalc image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        cd backend/tariffCalc
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_TARIFFCALC }}:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY_TARIFFCALC }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY_TARIFFCALC }}:latest
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_TARIFFCALC }}:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_TARIFFCALC }}:latest

    - name: Build and push user image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        cd backend/user
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_USER }}:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY_USER }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY_USER }}:latest
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_USER }}:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_USER }}:latest

    - name: Build and push news image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        cd backend/news
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NEWS }}:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NEWS }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NEWS }}:latest
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NEWS }}:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NEWS }}:latest

    - name: Build and push router image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        cd backend/router
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_ROUTER }}:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY_ROUTER }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY_ROUTER }}:latest
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_ROUTER }}:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_ROUTER }}:latest

    - name: Build and push frontend image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        cd frontend/tarrif-project
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:latest

    - name: Deploy to EC2
      env:
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        RUST_DATABASE_URL: ${{ secrets.RUST_DATABASE_URL }}
        THE_NEWS_API_KEY: ${{ secrets.THE_NEWS_API_KEY }}
        MOACH_API_KEY: ${{ secrets.MOACH_API_KEY }}
        SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        OPEN_AI_KEY: ${{ secrets.OPEN_AI_KEY }}
        VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        TARIFF_URL: ${{ secrets.TARIFF_URL }}
        USER_URL: ${{ secrets.USER_URL }}
        NEWS_URL: ${{ secrets.NEWS_URL }}
      run: |
        # Validate required secrets
        if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
          echo "Error: EC2_SSH_KEY secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.EC2_HOST }}" ]; then
          echo "Error: EC2_HOST secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.ENV_PROD_CONTENT }}" ]; then
          echo "Error: ENV_PROD_CONTENT secret is not set"
          exit 1
        fi

        # Create deployment script
        cat > deploy.sh << 'EOF'
        #!/bin/bash
        set -e

        # Save current version for rollback
        mkdir -p /home/ubuntu/tariff
        PREVIOUS_VERSION=$(cat /home/ubuntu/tariff/current_version.txt 2>/dev/null || echo "none")

        # Rollback function
        rollback() {
            echo "Deployment failed"
            if [ "$PREVIOUS_VERSION" != "none" ]; then
                echo "Rolling back to $PREVIOUS_VERSION"
                export TAG=$PREVIOUS_VERSION
                docker-compose --env-file .env.prod -f docker-compose.prod.yml down
                if docker-compose --env-file .env.prod -f docker-compose.prod.yml pull 2>/dev/null; then
                    docker-compose --env-file .env.prod -f docker-compose.prod.yml up -d
                    echo $PREVIOUS_VERSION > /home/ubuntu/tariff/current_version.txt
                    echo "Rollback completed"
                else
                    echo "Previous version $PREVIOUS_VERSION not available, cannot rollback"
                fi
            else
                echo "No previous version available for rollback"
            fi
            exit 1
        }

        # Set trap for automatic rollback on error
        trap rollback ERR

        # Login to ECR
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

        # Stop only containers related to this project (safer than stopping all)
        docker-compose --env-file .env.prod -f docker-compose.prod.yml down || true

        # Remove orphaned containers from this project
        docker container prune -f || true

        # Pull latest images
        docker-compose --env-file .env.prod -f docker-compose.prod.yml pull

        # Start services
        docker-compose --env-file .env.prod -f docker-compose.prod.yml up -d

        # Clean up old images, keeping 2 most recent per repository
        echo "Cleaning up old images, keeping 2 most recent per repository..."
        
        # Function to keep 2 most recent images for a repo
        keep_recent_images() {
            local repo=$1
            # List images sorted by creation time (newest first), skip first 2, delete the rest
            docker images $repo --format "table {{.Repository}}:{{.Tag}}\t{{.CreatedAt}}" | tail -n +2 | sort -k2 -r | tail -n +3 | awk '{print $1}' | xargs -r docker rmi || true
        }
        
        # Keep 2 for each service
        keep_recent_images "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND"
        keep_recent_images "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND"
        keep_recent_images "$ECR_REGISTRY/$ECR_REPOSITORY_ROUTER"
        
        # Also prune dangling images
        docker image prune -f

        # Update version file only on successful deployment
        mkdir -p /home/ubuntu/tariff
        echo $TAG > /home/ubuntu/tariff/current_version.txt
        echo "Deployment completed successfully"
        EOF

        # Copy files to EC2
        echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key
        chmod 600 ec2_key

        # Create .env.prod from secret
        echo "${{ secrets.ENV_PROD_CONTENT }}" > .env.prod

        scp -i ec2_key -o StrictHostKeyChecking=no deploy.sh ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/
        scp -i ec2_key -o StrictHostKeyChecking=no docker-compose.prod.yml ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/
        scp -i ec2_key -o StrictHostKeyChecking=no .env.prod ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/

        # Execute deployment on EC2 with environment variables
        ssh -i ec2_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << EOF
          export ECR_REGISTRY='${ECR_REGISTRY}'
          export ECR_REPOSITORY_BACKEND='goattariff/backend'
          export ECR_REPOSITORY_ROUTER='goattariff/router'
          export ECR_REPOSITORY_FRONTEND='goattariff/frontend'
          export TAG='${IMAGE_TAG}'
          export AWS_ACCESS_KEY_ID='${AWS_ACCESS_KEY_ID}'
          export AWS_SECRET_ACCESS_KEY='${AWS_SECRET_ACCESS_KEY}'
          export AWS_REGION='${AWS_REGION}'
          export DATABASE_URL='${DATABASE_URL}'
          export DB_USERNAME='${DB_USERNAME}'
          export DB_PASSWORD='${DB_PASSWORD}'
          export RUST_DATABASE_URL='${RUST_DATABASE_URL}'
          export THE_NEWS_API_KEY='${THE_NEWS_API_KEY}'
          export MOACH_API_KEY='${MOACH_API_KEY}'
          export SIGNING_SECRET='${SIGNING_SECRET}'
          export FRONTEND_URL='${FRONTEND_URL}'
          export OPEN_AI_KEY='${OPEN_AI_KEY}'
          export VITE_BACKEND_URL='${VITE_BACKEND_URL}'
          export TARIFF_URL='${TARIFF_URL}'
          export USER_URL='${USER_URL}'
          export NEWS_URL='${NEWS_URL}'
          
          # Append dynamic vars to .env.prod
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> .env.prod
          echo "TAG=$TAG" >> .env.prod
          echo "AWS_REGION=$AWS_REGION" >> .env.prod
          
          chmod +x deploy.sh
          ./deploy.sh
        EOF

        # Cleanup sensitive files from runner
        rm -f deploy.sh ec2_key .env.prod
name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to deploy (leave empty for auto-versioning)'
        required: false
        default: ''

env:
  AWS_REGION: ap-southeast-1  # Change to your preferred region
  ECR_REPOSITORY_BACKEND: goattariff/backend
  ECR_REPOSITORY_ROUTER: goattariff/router
  ECR_REPOSITORY_FRONTEND: goattariff/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Test Backend Services
      run: |
        cd backend/tariffCalc
        mvn test
        cd ../user
        mvn test
        cd ../news
        mvn test

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Test Frontend
      run: |
        cd frontend/tarrif-project
        npm install
        npm run lint

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set version tag
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version_tag }}" ]; then
          echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=V${{ github.run_number }}" >> $GITHUB_OUTPUT
        fi

    - name: Build and push backend image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        cd backend
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:latest
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:latest

    - name: Build and push router image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        cd backend/router
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_ROUTER }}:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY_ROUTER }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY_ROUTER }}:latest
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_ROUTER }}:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_ROUTER }}:latest

    - name: Build and push frontend image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        cd frontend/tarrif-project
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:latest

    - name: Deploy to EC2
      env:
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Create deployment script
        cat > deploy.sh << EOF
        #!/bin/bash
        set -e

        export ECR_REGISTRY=$ECR_REGISTRY
        export TAG=$IMAGE_TAG
        export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
        export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
        export AWS_REGION=$AWS_REGION

        # Install AWS CLI if not present
        if ! command -v aws &> /dev/null; then
            apt update && apt install -y awscli
        fi

        # Login to ECR
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

        # Stop existing containers
        docker-compose --env-file .env.prod -f docker-compose.prod.yml down || true

        # Pull latest images
        docker-compose --env-file .env.prod -f docker-compose.prod.yml pull

        # Start services
        docker-compose --env-file .env.prod -f docker-compose.prod.yml up -d

        # Clean up old images
        docker image prune -f

        # Save current version for rollback
        echo \$TAG > /opt/tariff/current_version.txt
        EOF

        # Copy files to EC2
        echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key
        chmod 600 ec2_key

        # Create .env.prod from secret
        echo "${{ secrets.ENV_PROD_CONTENT }}" > .env.prod

        scp -i ec2_key -o StrictHostKeyChecking=no deploy.sh ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/
        scp -i ec2_key -o StrictHostKeyChecking=no docker-compose.prod.yml ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/
        scp -i ec2_key -o StrictHostKeyChecking=no .env.prod ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/

        # Execute deployment on EC2
        ssh -i ec2_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << EOF
          chmod +x deploy.sh
          ./deploy.sh
        EOF
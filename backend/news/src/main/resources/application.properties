server.port=8083

# Database configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Database connection pool settings
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
logging.level.root=INFO

# Use Hibernate's non-contextual LOB creation to avoid PostgreSQL Large Object API issues
# This makes Hibernate use stream-based LOB handling instead of the LargeObject API which
# requires a non-autocommit connection. It avoids the "Large Objects may not be used in auto-commit mode"
# error when reading/writing CLOBs/LOBs via the Postgres driver in some environments.
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Suppress Hibernate SQL logs
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# OpenAI Configuration
spring.ai.openai.api-key=${OPEN_AI_KEY}

# TheNewsAPI Configuration
thenewsapi.api.key=${THE_NEWS_API_KEY}

# News retrieval tuning
# Cosine similarity threshold to consider DB results "close enough" (0.0-1.0)
news.similarity.threshold=0.89
# How many stored embeddings to fetch for DB-side similarity checking (Java-side fallback)
news.db.candidate.limit=20
# How many articles to return from DB when it's a hit
news.db.return.limit=3
# How many candidates to request from TheNewsAPI when we need to call the API
# How many candidates to request from TheNewsAPI when we need to call the API
news.api.candidate.limit=8
# Whether to store a query-aware embedding (embedding of query + article) when saving articles
news.queryEmbedding.store=false
# Minimum per-article similarity required to return an API candidate when doing rerank (0.0-1.0)
news.db.per_article_threshold=0.7
# Whether to use Postgres pgvector extension for DB-side KNN similarity search. Set true when pgvector is available.
news.db.use_pgvector=true
# The earliest publish date to request from TheNewsAPI (YYYY-MM-DD)
news.api.published_after=2020-01-01
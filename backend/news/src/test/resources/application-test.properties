# Test application properties for NewsEmbeddingService
spring.application.name=news-test

# Test database configuration (H2 in-memory for testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Test API keys (dummy values for testing)
spring.ai.openai.api-key=test-openai-key
thenewsapi.api.key=test-news-api-key

# Test news service configuration
news.similarity.threshold=0.75
news.db.candidate.limit=20
news.db.return.limit=3
news.api.candidate.limit=8
news.db.per_article_threshold=0.6
news.queryEmbedding.store=false
news.db.use_pgvector=false
news.api.published_after=2020-01-01

# Logging configuration for tests
logging.level.com.tariff.news=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Test WebClient configuration
spring.webflux.base-path=/api/v1

version: '3.8'

services:
  backend:
    image: ${ECR_REGISTRY}/goattariff/backend:${TAG:-latest}
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      MOACH_API_KEY: ${MOACH_API_KEY}
      SIGNING_SECRET: ${SIGNING_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      OPEN_AI_KEY: ${OPEN_AI_KEY}
      TARIFF_URL: ${TARIFF_URL}
      NEWS_URL: ${NEWS_URL}
      USER_URL: ${USER_URL}
      JAVA_OPTS: -Xmx768m -Xms256m
    volumes:
      - ./.env.prod:/app/.env:ro
    deploy:
      resources:
        limits:
          memory: 1GB
        reservations:
          memory: 512MB
    restart: unless-stopped

  router:
    image: ${ECR_REGISTRY}/goattariff/router:${TAG:-latest}
    ports:
      - "8080:8080"
    environment:
        RUST_DATABASE_URL: ${RUST_DATABASE_URL}
        FRONTEND_URL: ${FRONTEND_URL}
        TARIFF_URL: http://backend:8081
        USER_URL: http://backend:8082
        NEWS_URL: http://backend:8083
        RUST_LOG: info
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512MB
        reservations:
          memory: 256MB
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/goattariff/frontend:${TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - router
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
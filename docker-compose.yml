services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MAVEN_OPTS: -Dmaven.repo.local=/root/.m2/repository
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      MOACH_API_KEY: ${MOACH_API_KEY}
      SIGNING_SECRET: ${SIGNING_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      OPEN_AI_KEY: ${OPEN_AI_KEY}
      TARIFF_URL: http://backend:8081
      NEWS_URL: http://news:8083
      JAVA_OPTS: -Xmx768m -Xms256m
    volumes:
      - maven_cache:/root/.m2
    deploy:
      resources:
        limits:
          memory: 1GB
        reservations:
          memory: 512MB
    restart: unless-stopped
    depends_on:
      - news

  news:
    build:
      context: ./backend/news
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      OPEN_AI_KEY: ${OPEN_AI_KEY}
      THE_NEWS_API_KEY: ${THE_NEWS_API_KEY}
      JAVA_OPTS: -Xmx512m -Xms256m
    volumes:
      - maven_cache:/root/.m2
    deploy:
      resources:
        limits:
          memory: 512MB
        reservations:
          memory: 256MB
    restart: unless-stopped

  frontend:
    build: ./frontend/tarrif-project
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
      

volumes:
  maven_cache:
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MAVEN_OPTS: -Dmaven.repo.local=/root/.m2/repository
    ports:
      - "8082:8082"
      - "8081:8081"
      - "8084:8084"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_USERNAME: ${DB_USERNAME}
      THE_NEWS_API_KEY: ${THE_NEWS_API_KEY}
      DB_PASSWORD: ${DB_PASSWORD}
      MOACH_API_KEY: ${MOACH_API_KEY}
      SIGNING_SECRET: ${SIGNING_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      OPEN_AI_KEY: ${OPEN_AI_KEY}
      TARIFF_URL: http://backend:8081
      NEWS_URL: http://backend:8083
      JAVA_OPTS: -Xmx768m -Xms256m
    volumes:
      - maven_cache:/root/.m2
    deploy:
      resources:
        limits:
          memory: 1GB
        reservations:
          memory: 512MB
    restart: unless-stopped

  rust-router:
    build:
      context: ./backend/router
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

    environment:
        RUST_DATABASE_URL: ${RUST_DATABASE_URL}
        FRONTEND_URL: ${FRONTEND_URL}
        SIGNING_SECRET: ${SIGNING_SECRET}
        TARIFF_URL: http://backend:8081
        USER_URL: http://backend:8082
        NEWS_URL: http://backend:8083
        RUST_LOG: info
        RUST_BACKTRACE: full
    volumes:
      # ✅ Mount source code for development (hot reload)
        - ./backend/router/src:/app/src:ro

        # ✅ Mount migrations directory
        - ./backend/router/migrations:/app/migrations:ro

        # ✅ Mount config files
        - ./backend/router/diesel.toml:/app/diesel.toml:ro
        - ./backend/router/.env.rust:/app/.env
        # ✅ Mount target directory for faster rebuilds (optional)
        - rust_target_cache:/app/target
    deploy:
      resources:
        limits:
          memory: 512MB
        reservations:
          memory: 256MB
    restart: unless-stopped
    # restart: no

  frontend:
    build: ./frontend/tarrif-project
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}


volumes:
  maven_cache:
  rust_target_cache:

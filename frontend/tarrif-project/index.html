<!doctype html>
<html lang="en">
  <head>
    <!-- Basic HTML5 setup -->
    <meta charset="UTF-8" />
    
    <!-- Favicon for the browser tab -->
    <link rel="icon" type="image/svg+xml" href="/tempGOAT.png" sizes="" />
    
    <!-- Responsive viewport meta tag for mobile compatibility -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Fonts Performance Optimization: Pre-connect to font servers -->
    <!-- This establishes early connection to Google's font servers for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Load Inter font family with multiple weights for professional typography -->
    <!-- Inter is a modern, highly readable font designed specifically for digital interfaces -->
    <!-- Weights: 300=Light, 400=Regular, 500=Medium, 600=SemiBold, 700=Bold -->
    <!-- display=swap prevents invisible text during font load -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- fonts for the website -->
    
    <!-- Page title that appears in browser tab -->
    <title>TariffCalc - Global Tariff Calculator</title>
    
    <!-- Temporary fix for Cloudflare beacon integrity issue -->
    <script>
      // Remove integrity attribute from Cloudflare beacon to prevent hash mismatch errors
      document.addEventListener('DOMContentLoaded', function() {
        // Wait a bit for Cloudflare script to be injected
        setTimeout(function() {
          const cfScript = document.querySelector('script[src*="cloudflareinsights.com"]');
          if (cfScript) {
            cfScript.removeAttribute('integrity');
            console.log('Cloudflare beacon integrity attribute removed');
          }
        }, 100);
      });
    </script>
  </head>
  <body>
    <!-- React app mounting point - all React components will render inside this div -->
    <div id="root"></div>
    
    <!-- Main application entry point - loads the React app -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
